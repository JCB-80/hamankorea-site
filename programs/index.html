<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f6f2">
<meta name="description" content="하만코리아 SNS 자동 운영 프로그램의 공개 데모와 운영자 전용 작업실을 안내합니다.">
<link rel="canonical" href="https://hamankorea.me/programs/">
<title>프로그램 | 하만코리아</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{color-scheme:light;--paper:#f7f6f2;--ink:#141413;--muted:#57554f;--line:#d8d4c9;--warm:#78592e}
  body{margin:0;min-width:0;background:var(--paper);color:var(--ink);font:400 1rem/1.65 system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:break-word}
  a{color:inherit;text-underline-offset:.28em}
  a:focus-visible{outline:2px solid var(--warm);outline-offset:5px}
  .shell{width:min(100% - 48px,1200px);margin-inline:auto}
  .mast{min-height:82px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px}
  .brand{font-weight:800;text-decoration:none;letter-spacing:-.04em;padding-block:7px}
  .current{font-size:.9rem;font-weight:650}
  .main{padding-block:clamp(48px,8vw,104px)}
  .eyebrow{margin:0;color:var(--warm);font:600 .73rem/1.5 ui-monospace,monospace;letter-spacing:.18em}
  h1{margin:10px 0 0;font-size:clamp(2.65rem,7vw,5rem);line-height:1.12;letter-spacing:-.08em}
  .intro{margin:15px 0 34px;color:var(--muted)}
  .program{max-width:780px;padding:clamp(20px,4vw,36px);border:1px solid var(--line);border-radius:18px;background:#fffdf7;display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(14px,3vw,24px);align-items:start}
  .symbol{display:grid;place-items:center;width:49px;height:49px;border-radius:12px;background:#eae4d5;color:#433a29}
  .symbol svg{width:24px;height:24px}
  .program-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px}
  h2{margin:0;font-size:clamp(1.25rem,4vw,1.65rem);line-height:1.35;letter-spacing:-.035em}
  .status{display:inline-flex;align-items:center;gap:6px;max-width:100%;color:#5e4526;background:#f0e9d9;border-radius:99px;padding:3px 10px;font-size:.77rem;font-weight:700}
  .status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
  .summary{margin:10px 0;color:var(--muted)}
  .demo-link{display:inline-flex;align-items:center;min-height:44px;margin-top:4px;padding:8px 15px;border-radius:8px;background:#141413;color:#fffdf7;font-weight:750;text-decoration:none}
  .demo-link:hover{background:#433a29}
  .program-actions{display:flex;flex-wrap:wrap;gap:8px 10px}
  .workspace-link{border:1px solid var(--ink);background:transparent;color:var(--ink)}
  .workspace-link:hover{background:#eae4d5}
  .note{margin:16px 0 0;padding-top:13px;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}
  footer{border-top:1px solid var(--line);font-size:.88rem;color:var(--muted);padding-block:18px 30px}
  @media(max-width:420px){.shell{width:calc(100% - 32px)}.program{grid-template-columns:1fr}.symbol{width:42px;height:42px}}
</style>
</head>
<body>
<header class="shell mast">
  <a class="brand" href="/" aria-label="하만코리아 첫 화면">하만코리아</a>
  <nav aria-label="현재 메뉴"><span class="current" aria-current="page">프로그램</span></nav>
</header>
<main class="shell main">
  <p class="eyebrow">HAMAN KOREA / PROGRAMS</p>
  <h1>프로그램</h1>
  <p class="intro">하만코리아 프로그램을 이용할 수 있습니다.</p>
  <article class="program" aria-labelledby="sns-title">
    <span class="symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3.5v3m8-3v3M3.5 9.5h17M8 14h3m3 0h2m-8 3h3"/></svg></span>
    <div>
      <div class="program-top"><h2 id="sns-title">SNS 자동 운영</h2><span class="status">운영자 전용</span></div>
      <p class="summary">SNS 콘텐츠의 게시 일정을 관리하고 예약 발행하는 프로그램입니다.</p>
      <div class="program-actions">
        <a class="demo-link" href="/programs/demo/">로그인 없이 데모 체험</a>
        <a class="demo-link workspace-link" href="https://programs.hamankorea.me/">실제 작업실</a>
      </div>
      <p class="note">데모는 예시 데이터만 사용하며 실제 계정 연결이나 발행이 되지 않습니다. 실제 작업실은 운영자 로그인 후 이용할 수 있습니다.</p>
    </div>
  </article>
</main>
<footer class="shell"><a href="/">하만코리아 첫 화면으로</a></footer>
</body>
</html>
