<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>폰트 정리실 | 하만 작업실</title>
<script src="./fonts.js" defer></script>
<style>
:root{color-scheme:light;--paper:#f8f3e8;--white:#fffdf8;--ink:#14233a;--muted:#4b5768;--line:#d9d1c1;--accent:#a43e1b;--orange:#f28b54}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,sans-serif} .wrap{width:min(100% - 32px,1080px);margin:auto} .top{border-bottom:1px solid var(--line)} .top .wrap{padding:14px 0} a{color:var(--ink);text-underline-offset:4px} main{padding:clamp(25px,7vw,60px) 0 54px}
h1,h2,p{margin:0} h1{font-size:clamp(38px,7vw,68px);line-height:1.1;letter-spacing:-.06em;margin:8px 0 12px} h2{font-size:19px;line-height:1.4}.eyebrow{color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.08em}.sub{color:var(--muted);max-width:62ch}.hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:27px}
.add,.button,.tab,button{font:inherit;cursor:pointer;border:1px solid var(--line);color:var(--ink);background:var(--white);border-radius:9px;padding:7px 12px;line-height:1.4;min-height:42px}.add{display:inline-flex;align-items:center;white-space:nowrap;background:var(--orange);border-color:transparent;font-weight:800;padding:11px 16px}.fake-hidden{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}.fake-hidden:focus-visible+.add,:is(a,button,input,select):focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.controls{display:grid;grid-template-columns:minmax(180px,1.7fr) minmax(145px,1fr) minmax(150px,1fr);gap:14px;background:var(--ink);color:var(--white);padding:16px;border-radius:15px}.field{display:grid;gap:4px;align-content:start;font-size:14px;font-weight:700}.controls input:not([type="range"]), .controls select{min-width:0;width:100%;background:var(--white);border:1px solid transparent;border-radius:8px;font:inherit;font-size:16px;color:var(--ink);padding:7px 9px;min-height:42px}.controls input[type="range"]{width:100%;min-height:34px;accent-color:var(--orange);margin:4px 0}
.notice{min-height:29px;margin:8px 0 5px;font-size:14px;color:var(--muted);overflow-wrap:anywhere}.notice.error{color:#922e19}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:12px 0}.tabs,.selection-actions{display:flex;gap:8px;flex-wrap:wrap}.tab[aria-pressed=true],.button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--white)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,292px),1fr));gap:12px}.card,.empty,.selection{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px}.empty{border-style:dashed;grid-column:1/-1;padding:23px;color:var(--muted)}.card header{display:flex;justify-content:space-between;gap:10px;align-items:start}.card h2{overflow-wrap:anywhere}.format{font:800 12px/1.5 system-ui;color:var(--accent);white-space:nowrap}.preview{padding:12px 0;min-height:95px;overflow-wrap:anywhere;line-height:1.12;white-space:pre-wrap}.card footer{display:flex;justify-content:space-between;gap:8px}.selection-actions[hidden]{display:none}.selection{margin-top:18px}.selection ul{padding-left:22px;margin:7px 0 0;overflow-wrap:anywhere}.selection .sub{font-size:14px}.privacy{color:var(--muted);font-size:13px;margin-top:15px}
@media(max-width:690px){.controls{grid-template-columns:1fr 1fr}.field:first-child{grid-column:1/-1}.hero{align-items:start;flex-direction:column}}@media(max-width:350px){.controls{grid-template-columns:1fr}.field:first-child{grid-column:auto}.card footer{flex-wrap:wrap}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a href="./">← 하만 작업실</a></div></header>
<main class="wrap">
<section class="hero" aria-labelledby="title">
<div><p class="eyebrow">하만 작업실 · 글꼴 도구</p><h1 id="title">폰트 정리실</h1><p class="sub">같은 문장으로 여러 글꼴을 비교하고, 마음에 드는 글꼴만 골라보세요.</p></div>
<div><input class="fake-hidden" id="fileInput" type="file" accept=".ttf,.otf,.woff,.woff2" multiple aria-describedby="privacy"><label for="fileInput" class="add">＋ 글꼴 열기</label></div>
</section>
<div class="controls">
<label class="field" for="sample">미리보기 문장<input id="sample" maxlength="160" value="한글의 여백, Haman 123" autocomplete="off"></label>
<label class="field" for="size">글자 크기 <output id="sizeValue" for="size">40px</output><input id="size" type="range" min="16" max="96" value="40"></label>
<label class="field" for="filter">파일 이름 찾기<input id="filter" type="search" maxlength="100" placeholder="예: 나눔 또는 Noto" autocomplete="off"></label>
</div>
<p class="notice" id="notice" role="status" aria-live="polite"></p>
<div class="toolbar">
<div class="tabs" aria-label="글꼴 보기"><button class="tab" id="allTab" type="button" aria-pressed="true">전체 <span id="fontCount">0</span></button><button class="tab" id="selectedTab" type="button" aria-pressed="false">선택 <span id="selectedCount">0</span></button></div>
<label for="format">형식 <select class="button" id="format"><option value="">모든 형식</option><option>TTF</option><option>OTF</option><option>WOFF</option><option>WOFF2</option></select></label>
</div>
<section class="cards" id="cards" aria-label="글꼴 미리보기"><div class="empty">글꼴 파일을 열면 이곳에 비교 카드가 표시됩니다.</div></section>
<section class="selection" aria-labelledby="selectionTitle"><h2 id="selectionTitle">선택한 글꼴</h2><p class="sub">최종 후보의 파일 이름만 기록할 수 있습니다.</p><ul id="selectedList"></ul><div class="selection-actions" id="selectionActions" hidden><button id="downloadNames" type="button">선택 목록 저장 (.txt)</button><button id="clearSelection" type="button">선택 해제</button></div></section>
<p class="privacy" id="privacy">TTF, OTF, WOFF, WOFF2 지원 · 최대 25개, 파일당 15MB · 글꼴은 외부에 전송되지 않고 새로고침하면 목록에서 지워집니다. 글꼴 파일의 이용 범위는 원래 라이선스를 따릅니다.</p>
</main>
</body>
</html>
