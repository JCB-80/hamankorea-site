<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12161c"><title>모션그래픽 편집기 · Haman 작업실</title>
<style>
:root{color-scheme:dark;--canvas:#11151a;--panel:#1a2028;--line:#323b47;--txt:#f3f6fa;--muted:#aeb9c8;--accent:#a9f2d2;font-family:system-ui,"Malgun Gothic",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--txt)}main{max-width:1180px;margin:auto;padding:24px clamp(14px,4vw,45px) 56px}a{color:var(--accent)}h1{font-size:clamp(26px,5vw,38px);margin:20px 0 5px;letter-spacing:-.05em}p{color:var(--muted);line-height:1.6;margin:0 0 20px}.tag{letter-spacing:.13em;font-size:.72rem;text-transform:uppercase;color:var(--accent);font-weight:700}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}.panel{border:1px solid var(--line);border-radius:14px;padding:15px;background:var(--panel);min-width:0}h2{font-size:1.04rem;margin:0 0 12px}canvas{display:block;margin:0 auto;background:#11171e;width:auto;max-width:100%;height:auto;max-height:min(62vh,550px);border-radius:8px}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}button,input,textarea,select{font:inherit;color:inherit}button,.import,select,input:not([type=range]),textarea{border:1px solid #485667;background:#202933;border-radius:8px;padding:8px 11px}button,.import{cursor:pointer;min-height:42px;font-size:.88rem;font-weight:650}button.primary{background:var(--accent);color:#132820;border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.import:focus-within{outline:3px solid var(--accent);outline-offset:3px}textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:5px;font-size:.84rem;color:var(--muted)}.field{margin-bottom:10px}input[type=color]{height:41px}input,select,textarea{min-width:0;width:100%}input[type=range]{flex:1;min-width:70px;accent-color:var(--accent)}.timeline{margin-top:16px}.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.head h2{margin:0}ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}li button{display:block;padding:10px;text-align:left;width:100%;min-width:0}li button[aria-pressed=true]{border-color:var(--accent);background:#263d38}li strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}small,.muted{color:var(--muted)}#status{min-height:1.4em;margin:12px 0 0}.import{display:inline-flex;align-items:center;color:var(--txt)}.import input{position:absolute;opacity:0;clip-path:inset(50%);width:1px;height:1px}.counts{font-variant-numeric:tabular-nums;font-size:.85rem}.subtle{font-size:.78rem;margin:7px 0 0}@media(max-width:700px){.grid{grid-template-columns:1fr}canvas{max-height:min(53vh,480px)}ol{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
</style></head><body><main><nav aria-label="작업실"><a href="./">← 작업실</a></nav><header><p class="tag" style="margin:18px 0 0">Haman · Motion Lab</p><h1>모션그래픽 편집기</h1><p>텍스트와 컬러로 컷을 만들고, 전환을 이어 하나의 세로 영상으로 확인하세요.</p></header>
<div class="grid"><section class="panel" aria-labelledby="previewTitle"><div class="head"><h2 id="previewTitle">미리보기</h2><small>9:16 · 720 × 1280</small></div><canvas id="stage" width="720" height="1280" aria-label="편집한 장면 미리보기"></canvas><div class="tools"><button type="button" class="primary" id="play">재생</button><input id="seek" type="range" min="0" max="1" step=".02" value="0" aria-label="재생 위치"><span id="time" class="counts" aria-label="경과 시간"></span></div></section>
<section class="panel" aria-labelledby="editTitle"><h2 id="editTitle">선택한 컷</h2>
<label class="field">화면 문구<textarea id="title" maxlength="180" placeholder="화면에 나올 문구"></textarea></label>
<label class="field">보조 문구<input id="subtitle" type="text" maxlength="120" placeholder="선택 사항"></label>
<div class="row field"><label>배경 색상<input id="bg" type="color"></label><label>글자 색상<input id="fg" type="color"></label></div>
<div class="row field"><label>길이(초)<input id="duration" type="number" min=".5" max="30" step=".1"></label><label>이 컷이 들어올 때<select id="transition"><option value="cut">컷</option><option value="fade">디졸브</option><option value="slide">슬라이드</option><option value="zoom">줌인</option></select></label></div>
<div class="tools"><button type="button" id="earlier">← 앞으로</button><button type="button" id="later">뒤로 →</button><button type="button" id="remove">컷 삭제</button></div>
</section></div>
<section class="panel timeline" aria-labelledby="timelineTitle"><div class="head"><h2 id="timelineTitle">컷 타임라인</h2><button type="button" id="add">＋ 컷 추가</button></div><ol id="cuts"></ol></section>
<div class="tools"><button type="button" id="save">프로젝트 JSON 저장</button><label class="import">JSON 불러오기<input id="load" type="file" accept=".json,application/json"></label></div>
<p class="subtle">작업은 이 브라우저에 자동 저장됩니다. 다른 기기로 옮기려면 프로젝트 JSON을 저장하세요.</p><p id="status" role="status"></p>
</main><script defer src="./scenes.js"></script></body></html>
